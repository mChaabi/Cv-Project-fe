<div class="create-offre-container">
  <div class="form-card">
    <div class="form-header">
      <h2>{{ 'offreCreate.title' | translate }}</h2>
      <p>{{ 'offreCreate.subtitle' | translate }}</p>
    </div>

    <form [formGroup]="offreForm" (ngSubmit)="onSubmit()">
      <div class="form-grid">

        <div class="form-group full-width">
          <label>{{ 'offreCreate.titre' | translate }} <span class="required">*</span></label>
          <input type="text" formControlName="titre" [placeholder]="'offreCreate.titrePlaceholder' | translate" />
          @if (offreForm.get('titre')?.touched && offreForm.get('titre')?.invalid) {
          <span class="error-hint">{{ 'offreCreate.titreError' | translate }}</span>
          }
        </div>

        <div class="form-group">
          <label>{{ 'offreCreate.departement' | translate }} <span class="required">*</span></label>
          <input type="text" formControlName="departement"
            [placeholder]="'offreCreate.departementPlaceholder' | translate" />
        </div>

        <div class="form-group">
          <label>{{ 'offreCreate.statut' | translate }} <span class="required">*</span></label>
          <select formControlName="statut">
            <option value="OUVERTE">{{ 'offres.statutOuverte' | translate }}</option>
            <option value="FERMEE">{{ 'offres.statutFermee' | translate }}</option>
          </select>
        </div>

        <div class="form-group">
          <label>{{ 'offreCreate.typeContrat' | translate }} <span class="required">*</span></label>
          <select formControlName="typeContrat">
            <option value="CDI">CDI</option>
            <option value="CDD">CDD</option>
            <option value="STAGE">Stage</option>
            <option value="FREELANCE">Freelance</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label>{{ 'offreCreate.description' | translate }} <span class="required">*</span></label>
          <textarea formControlName="description" rows="6"
            [placeholder]="'offreCreate.descriptionPlaceholder' | translate"></textarea>
        </div>

      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="goBack()">{{ 'offreCreate.cancel' | translate }}</button>
        <button type="submit" class="btn-primary" [disabled]="offreForm.invalid || isSubmitting()">
          {{ isSubmitting() ? ('offreCreate.submitting' | translate) : ('offreCreate.submit' | translate) }}
        </button>
      </div>
    </form>
  </div>
</div>
