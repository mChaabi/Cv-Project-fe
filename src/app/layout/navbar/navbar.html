<header class="navbar-container" [class.dark-theme]="isDarkTheme">
  <!-- Input con placeholder traducido -->
  <input type="text" class="search-input" [placeholder]="'nav.search' | translate" />

  <div class="navbar-actions">
    <!-- Sélecteur de langue propre -->
    <select class="language-select" [value]="currentLang" (change)="onLanguageChange($event)">
      <option value="fr">🇫🇷 FR</option>
      <option value="en">🇬🇧 EN</option>
      <option value="es">🇪🇸 ES</option>
      <option value="ar">🇲🇦 AR</option>
    </select>
    
    <!-- Bouton Thème interactif -->
    <button class="action-btn" (click)="toggleTheme()" title="Basculer le thème">
      {{ isDarkTheme ? '☀️ ' + ('nav.clear' | translate) : '🌙 ' + ('nav.theme' | translate) }}
    </button>

    <!-- Botón de Notificaciones / Alertas traducido -->
    <button class="action-btn has-badge" title="Notifications">
      {{ 'nav.alerts' | translate }}
      <span class="badge-dot"></span>
    </button>

    <div class="divider"></div>

    <div class="user-profile">
      <!-- Avatar dynamique généré à partir des initiales -->
      <div class="avatar">{{ userInitials }}</div>
      <div class="user-info">
        <span class="user-name">{{ userName }}</span>
        <span class="user-role">{{ userRoleDisplay }}</span>
      </div>
    </div>
  </div>
</header>
